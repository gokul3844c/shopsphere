{% extends 'base.html' %}
{% block title %}Password Reset Complete | ShopSphere{% endblock %}
{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-brand-center">
    <div class="brand-logo">
      Shop<span style="color: var(--deal-red);">Sphere</span><span class="dot" style="color: var(--stock-low);">.</span><span class="in-badge" style="color: var(--deal-red);">in</span>
    </div>
  </div>

  <div class="auth-box">
    <h1>Password changed!</h1>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">
      Your password has been set. You may now proceed to sign in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-block" style="padding: 10px;">Sign In to ShopSphere</a>
  </div>
</div>
{% endblock %}
