{% extends 'base.html' %}
{% block title %}Password Reset Sent | ShopSphere{% endblock %}
{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-brand-center">
    <div class="brand-logo">
      Shop<span style="color: var(--deal-red);">Sphere</span><span class="dot" style="color: var(--stock-low);">.</span><span class="in-badge" style="color: var(--deal-red);">in</span>
    </div>
  </div>

  <div class="auth-box">
    <h1>Check your email</h1>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5;">
      We've sent password reset instructions to your email address. Please check your inbox and click the link to proceed.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-block" style="padding: 10px;">Return to Sign In</a>
  </div>
</div>
{% endblock %}
